{{- if .Values.gateway.enabled }}
{{- $name := printf "%s-gateway" .Release.Name | trunc 63 | trimSuffix "-" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-llm.labels" . | nindent 4 }}
data:
  litellm.yaml: |
    {{- .Files.Get "files/litellm.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-llm.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ .Files.Get "files/litellm.yaml" | sha256sum }}
    spec:
      containers:
        - name: litellm
          image: {{ .Values.gateway.image }}
          args: ["--config", "/app/litellm.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            {{- range .Values.models }}
            {{- if .enabled }}
            - name: VLLM_{{ include "open-llm.envSlug" .name }}_API_BASE
              value: http://{{ printf "%s-vllm-%s" $.Release.Name (include "open-llm.k8sName" .name) | trunc 63 | trimSuffix "-" }}:8000/v1
            {{- end }}
            {{- end }}
            {{- with .Values.gateway.ollamaApiBase }}
            - name: OLLAMA_API_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.gateway.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.gateway.masterKeySecret }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.masterKeySecret }}
                  key: LITELLM_MASTER_KEY
            {{- end }}
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /app/litellm.yaml, subPath: litellm.yaml}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
