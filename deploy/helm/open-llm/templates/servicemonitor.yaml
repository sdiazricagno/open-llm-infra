{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-open-llm
  labels:
    {{- include "open-llm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: open-llm-infra
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
