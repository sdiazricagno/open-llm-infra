router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 300
  allowed_fails: 1
  cooldown_time: 30
litellm_settings:
  callbacks:
  - prometheus
  fallbacks:
  - fast:
    - llama3.2-1b
  - balanced:
    - gemma2-2b
    - qwen2.5-0.5b
  - quality:
    - mistral-7b
    - llama3.2-3b
  drop_params: true
  request_timeout: 300
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
