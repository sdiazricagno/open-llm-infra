global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics/
    static_configs:
      - targets: ["gateway:4000"]
  - job_name: llamacpp
    static_configs:
      - targets: ["llamacpp:8080"]
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
