name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m openllm gateway --check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check deploy/terraform
      - name: validate
        run: |
          for d in deploy/terraform/envs/*; do
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/open-llm
      - run: helm template t deploy/helm/open-llm > /dev/null
      - run: helm template t deploy/helm/open-llm --set autoscaling.mode=hpa > /dev/null
      - run: docker compose -f deploy/compose/docker-compose.yml config -q
      - run: docker compose -f deploy/compose/docker-compose.yml --profile gpu config -q
